version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ueba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ueba_db
      POSTGRES_USER: ueba_user
      POSTGRES_PASSWORD: ueba_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ueba_user -d ueba_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ueba_redis
    restart: unless-stopped
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ueba_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DATABASE_URL=postgresql://ueba_user:ueba_password@db:5432/ueba_db
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-llm:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ueba_worker_llm
    restart: unless-stopped
    command: celery -A config worker -Q llm -c 2 -n llm@%h -l info
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DATABASE_URL=postgresql://ueba_user:ueba_password@db:5432/ueba_db
      - REDIS_URL=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-governance:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ueba_worker_governance
    restart: unless-stopped
    command: celery -A config worker -Q governance -c 1 -n gov@%h -l info
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DATABASE_URL=postgresql://ueba_user:ueba_password@db:5432/ueba_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ueba_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
